name: Code quality

on:
  push:
    branches: [ main ] # Adjust branches as needed
  pull_request:
    branches: [ main ] # Adjust branches as needed

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Biome
        uses: biomejs/setup-biome@f382a98e582959e6aaac8e5f8b17b31749018780 # v2.5.0
        with:
          # 固定为 package.json 中 @biomejs/biome 的版本。
          # 用 latest 会随上游发布漂移：Biome 2.6 调整了 markdown 格式规则，
          # 导致本地 fmt 通过、CI 却报 "File content differs from formatting output"。
          version: "2.5.15"
      - name: Run Biome
        run: biome ci ./src --reporter=github
