# Sveltia CMS 配置 — yuihoyo.top 站内写作后台
# 版本：@sveltia/cms 0.245.0（自托管于本目录，升级 = 替换 sveltia-cms.js 与 chunks/ 下同名文件）
# 文章路径：src/content/posts/<slug>/index.md，图片落文章同目录（与本仓库现状一致）

backend:
  name: github
  repo: x1ao-yu/blog
  branch: main
  base_url: https://sveltia-cms-auth.wangjinfu2003.workers.dev # 鉴权 Worker（GitHub OAuth 中转）
  commit_messages:
    create: 'docs: 新增文章 "{{slug}}"'
    update: 'docs: 更新文章 "{{slug}}"'
    delete: 'docs: 删除文章 "{{slug}}"'
    uploadMedia: 'chore(assets): 上传图片 {{path}}'
    deleteMedia: 'chore(assets): 删除图片 {{path}}'

site_url: https://yuihoyo.top
display_url: https://yuihoyo.top
app_title: yuihoyo 内容后台

output:
  omit_empty_optional_fields: true # 空的可选字段不写盘，避免 Zod optional 报错

media_folder: public/media # 顶层兜底（文章图片实际走集合级 ''，落在文章目录）
public_folder: /media

collections:
  - name: posts
    label: 文章
    folder: src/content/posts
    create: true
    path: '{{slug}}/index' # 存为 <slug>/index.md
    media_folder: '' # 空串 = 图片保存到文章同目录
    public_folder: '' # 空串 = frontmatter/正文写裸文件名（如 image.png）
    slug: # 站长手填英文/拼音 slug（新建时必填，位于编辑器侧栏的 Slug 面板）
      editable: true
      hint: '英文或拼音，小写字母/数字/短横线，如 deploy-opencode；将成为文章目录名与 URL。不能正好是 admin / cms（CMS 安全规则保留名）'
      pattern: ['^(?!admin$)(?!cms$)[a-z0-9]+(-[a-z0-9]+)*$', '只允许小写字母、数字和短横线；且不能正好是 admin 或 cms（保留名）']
    sortable_fields: [published, title, updated, category]
    fields:
      - { name: title, label: 标题, widget: string }
      - { name: published, label: 发布日期, widget: datetime, type: date, default: '{{now}}' }
      - { name: updated, label: 更新日期, widget: datetime, type: date, required: false }
      - { name: draft, label: 草稿, widget: boolean, default: false }
      - { name: description, label: 摘要, widget: text, required: false }
      - name: image
        label: 封面图
        widget: image
        required: false
        hint: '仅支持 png / jpg / jpeg / webp / avif；gif、svg 会导致构建失败；留空则无封面'
      - name: tags
        label: 标签
        widget: list
        required: false
        default: []
        field: { name: tag, label: 标签, widget: string }
      - { name: category, label: 分类, widget: string, required: false, hint: '如 AI、软件、教程' }
      - { name: lang, label: 语言, widget: string, required: false, hint: '留空为站点默认' }
      - { name: pinned, label: 置顶, widget: boolean, default: false }
      - { name: author, label: 作者, widget: string, required: false }
      - { name: sourceLink, label: 原文链接, widget: string, required: false }
      - { name: licenseName, label: 许可名称, widget: string, required: false }
      - { name: licenseUrl, label: 许可地址, widget: string, required: false }
      - { name: comment, label: 开启评论, widget: boolean, default: true }
      - { name: password, label: 访问密码, widget: string, required: false, hint: '留空=无密码' }
      - { name: passwordHint, label: 密码提示, widget: string, required: false }
      - { name: body, label: 正文, widget: markdown, required: false }

  - name: dynamic
    label: 动态
    label_singular: 动态
    folder: src/content/dynamic
    create: true
    identifier_field: published
    slug: # 自动生成时间戳文件名（与 scripts/new-dynamic.js 约定一致），不可编辑
      template: '{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}{{second}}'
      editable: false
    path: '{{slug}}'
    fields:
      - { name: published, label: 发布时间, widget: datetime, required: true, default: '{{now}}' }
      - { name: pinned, label: 置顶, widget: boolean, default: false }
      - { name: location, label: 位置, widget: string, required: false }
      - { name: body, label: 内容, widget: text, required: false }

  - name: gallery
    label: 相册
    label_singular: 相册
    folder: src/content/gallery
    create: true
    identifier_field: name
    path: '{{slug}}'
    media_folder: 'public/gallery/{{slug}}' # 照片上传到相册对应的公开目录
    public_folder: '/gallery/{{slug}}'
    slug: # 站长手填英文/拼音 id（新建时必填，位于编辑器侧栏的 Slug 面板）
      editable: true
      hint: '英文/拼音 id，将成为相册目录名与 URL（如 japan-2025）；不能正好是 admin / cms（CMS 安全规则保留名）'
      pattern: ['^(?!admin$)(?!cms$)[a-z0-9]+(-[a-z0-9]+)*$', '只允许小写字母、数字和短横线；且不能正好是 admin 或 cms（保留名）']
    fields:
      - { name: name, label: 相册名称, widget: string }
      - { name: description, label: 描述, widget: string, required: false }
      - { name: date, label: 日期, widget: datetime, type: date, required: false }
      - { name: location, label: 拍摄地点, widget: string, required: false }
      - name: tags
        label: 标签
        widget: list
        required: false
        default: []
        field: { name: tag, label: 标签, widget: string }
      - name: cover
        label: 封面图
        widget: image
        required: false
        hint: '留空自动取相册内 cover.* 或第一张照片；也可从媒体库选择（路径形如 /gallery/<相册id>/xxx.png）'
      - { name: password, label: 访问密码, widget: string, required: false, hint: '留空则公开' }
      - { name: passwordHint, label: 密码提示, widget: string, required: false }

  - name: pages
    label: 页面
    files:
      - name: about
        label: 关于
        file: src/content/spec/about.md
        fields:
          - { name: body, label: 内容, widget: markdown, required: false }
      - name: friends
        label: 友情链接
        file: src/content/spec/friends.md
        fields:
          - { name: title, label: 标题, widget: string, required: false }
          - { name: description, label: 描述, widget: string, required: false }
          - { name: body, label: 内容, widget: markdown, required: false }
      - name: guestbook
        label: 留言板
        file: src/content/spec/guestbook.md
        fields:
          - { name: title, label: 标题, widget: string, required: false }
          - { name: description, label: 描述, widget: string, required: false }
          - { name: body, label: 内容, widget: markdown, required: false }
